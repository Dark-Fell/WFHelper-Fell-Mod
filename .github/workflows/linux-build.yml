name: Build Linux

on:
  push:
    tags:
      - 'v2.1.1.5'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux (tar.xz)
        run: pnpm exec electron-builder --linux tar.xz --publish never
        env:
          CI: true

      - name: Upload Linux tar.xz artifact
        uses: actions/upload-artifact@v4
        with:
          name: WFHelper-2.1.1-linux
          path: release/WFHelper-2.1.1.tar.xz
          retention-days: 30